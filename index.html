<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Advisor Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Personal Finance Advisor Bot 💰</h1>
            <p>Smart Budgeting & AI-Driven Savings Insights</p>
        </header>
        <main>
            <section class="cards-grid">
                <div class="card"><h3>Total Income</h3><p id="income-val">₹0</p></div>
                <div class="card"><h3>Total Expenses</h3><p id="expense-val">₹0</p></div>
                <div class="card"><h3>Remaining Balance</h3><p id="balance-val">₹0</p></div>
            </section>
            <section class="form-section">
                <h2>Add Transaction</h2>
                <form id="tx-form">
                    <select id="kind" required>
                        <option value="income">Income</option>
                        <option value="expense" selected>Expense</option>
                    </select>
                    <input type="text" id="category" placeholder="Category (e.g., Food, Rent, Salary)" required>
                    <input type="number" id="amount" placeholder="Amount (₹)" min="1" step="any" required>
                    <input type="text" id="note" placeholder="Note (Optional)">
                    <button type="submit">Add</button>
                </form>
            </section>
            <section class="insight-section card">
                <h3 id="insight-title">AI Insight Loading...</h3>
                <p id="insight-text">Please wait...</p>
            </section>
            <section class="tx-history">
                <h2>Recent Transactions</h2>
                <ul id="tx-list"></ul>
            </section>
        </main>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
